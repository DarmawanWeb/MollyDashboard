# Molly Dashboard on a shared server (Mac mini next to NETRA, Taksu and the monitoring stack).
# One container, published on the loopback only, for the existing cloudflared tunnel:
#   cp deploy/.env.example deploy/.env && deploy/deploy.sh
# MOLLY_BIND=0.0.0.0 also serves it on the LAN, which a real robot needs (see README, Deploy).
name: molly

services:
  dashboard:
    image: molly/dashboard:local
    build:
      context: .
      args:
        NEXT_PUBLIC_ROSBRIDGE_URL: ${NEXT_PUBLIC_ROSBRIDGE_URL:-ws://localhost:9090}
        NEXT_PUBLIC_VIDEO_SERVER_URL: ${NEXT_PUBLIC_VIDEO_SERVER_URL:-http://localhost:8080}
        NEXT_PUBLIC_USE_MOCKS: ${NEXT_PUBLIC_USE_MOCKS:-false}
    restart: unless-stopped
    ports:
      - "${MOLLY_BIND:-127.0.0.1}:${MOLLY_PORT:-4470}:3000"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
